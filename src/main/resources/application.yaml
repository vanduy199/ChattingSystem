server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ChattingSystem

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
    open-in-view: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  docker:
    compose:
      enabled: false

  task:
    scheduling:
      pool:
        size: 3

firebase:
  service-account: ${FIREBASE_SERVICE_ACCOUNT}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:30d}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://chatchit.me,https://www.chatchit.me,http://192.168.50.199:3000}

storage:
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:auto}
  bucket: ${STORAGE_BUCKET:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:}

media:
  storage:
    bucket: ${MEDIA_STORAGE_BUCKET:}
    region: ${MEDIA_STORAGE_REGION:us-east-1}
    endpoint: ${MEDIA_STORAGE_ENDPOINT:}
    public-endpoint: ${MEDIA_STORAGE_PUBLIC_ENDPOINT:}
    path-style: ${MEDIA_STORAGE_PATH_STYLE:false}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:}
    chunk-size-bytes: 5242880
    put-url-ttl: PT15M
    get-url-ttl: PT30M
  upload:
    session-ttl: PT24H
  limits:
    image-max-bytes:
      guest: ${MEDIA_LIMIT_IMAGE_GUEST:5242880}
      public: ${MEDIA_LIMIT_IMAGE_PUBLIC:20971520}
      private: ${MEDIA_LIMIT_IMAGE_PRIVATE:26214400}
    video-max-bytes:
      guest: ${MEDIA_LIMIT_VIDEO_GUEST:20971520}
      public: ${MEDIA_LIMIT_VIDEO_PUBLIC:52428800}
      private: ${MEDIA_LIMIT_VIDEO_PRIVATE:104857600}
    max-files-per-message:
      guest: 2
      public: 5
      private: 10
    max-open-uploads:
      guest: 3
      public: 10
      private: 10
    max-init-per-minute:
      guest: 10
      public: 30
      private: 30
  quota:
    zone: Asia/Ho_Chi_Minh
    hd-per-day: 5
  worker:
    enabled: ${MEDIA_WORKER_ENABLED:true}
    concurrency: 1
    poll-interval: PT2S
    job-timeout: PT10M
    max-attempts: 4
    temp-dir: ${MEDIA_WORKER_TEMP_DIR:/tmp/media-work}
    max-download-bytes: 268435456
    max-pixels: 50000000
    max-video-duration-seconds: 300
  gc:
    enabled: ${MEDIA_GC_ENABLED:true}
    cron: ${MEDIA_GC_CRON:0 0 * * * *}
    batch-size: 200
    max-batches-per-run: 20
    orphan-ttl: P7D
    purge-grace: PT24H
    creating-timeout: PT10M
    completing-timeout: PT15M
    failed-ttl: P1D
    uploading-ttl: PT24H
    storage-claim-lease: PT10M

