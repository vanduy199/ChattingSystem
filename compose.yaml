services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'

  minio:
    image: 'minio/minio:RELEASE.2025-04-08T15-41-24Z'
    container_name: chattingsystem-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_STORAGE_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MEDIA_STORAGE_SECRET_KEY:-admin123}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://192.168.50.199:3000,https://chatchit.me,https://www.chatchit.me"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
